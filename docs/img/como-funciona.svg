<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="O FrutaMIDI só envia notas; o som nasce no computador" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13">
<rect width="760" height="250" rx="12" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9a92"/></marker></defs>
<text x="24" y="34" font-size="15" fill="#1d1d1b" text-anchor="start" font-weight="600">O FrutaMIDI só envia notas; o som nasce no computador</text>
<path d="M178 136H210" fill="none" stroke="#9b9a92" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M364 136H396" fill="none" stroke="#9b9a92" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M550 136H582" fill="none" stroke="#9b9a92" stroke-width="1.25" marker-end="url(#a)"/>
<text x="194.0" y="80" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">crocodilo</text>
<text x="380.0" y="80" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">I²C, 4 fios</text>
<text x="566.0" y="80" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">USB MIDI</text>
<rect x="24" y="92" width="154" height="88" rx="8" fill="none" stroke="#9b9a92" stroke-width="1.25"/>
<text x="101.0" y="116" font-size="13" fill="#1d1d1b" text-anchor="middle" font-weight="600">Objetos</text>
<text x="101.0" y="136" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">fruta, plantas,</text>
<text x="101.0" y="152" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">água, metal</text>
<text x="101.0" y="168" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">até 12 (ou 24)</text>
<rect x="210" y="92" width="154" height="88" rx="8" fill="none" stroke="#9b9a92" stroke-width="1.25"/>
<text x="287.0" y="116" font-size="13" fill="#1d1d1b" text-anchor="middle" font-weight="600">MPR121</text>
<text x="287.0" y="136" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">mede a capacidade</text>
<text x="287.0" y="152" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">de cada elétrodo</text>
<text x="287.0" y="168" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">e deteta o toque</text>
<rect x="396" y="92" width="154" height="88" rx="8" fill="none" stroke="#9b9a92" stroke-width="1.25"/>
<text x="473.0" y="116" font-size="13" fill="#1d1d1b" text-anchor="middle" font-weight="600">Raspberry Pi Pico</text>
<text x="473.0" y="136" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">toque: Note On</text>
<text x="473.0" y="152" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">largar: Note Off</text>
<text x="473.0" y="168" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">pressão: aftertouch</text>
<rect x="582" y="92" width="154" height="88" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
<text x="659.0" y="116" font-size="13" fill="#1d1d1b" text-anchor="middle" font-weight="600">Computador</text>
<text x="659.0" y="136" font-size="11.5" fill="#1d1d1b" text-anchor="middle" font-weight="400">sampler no browser,</text>
<text x="659.0" y="152" font-size="11.5" fill="#1d1d1b" text-anchor="middle" font-weight="400">Ableton, LMMS,</text>
<text x="659.0" y="168" font-size="11.5" fill="#1d1d1b" text-anchor="middle" font-weight="400">FL Studio…: o som</text>
<path d="M101.0 180V212H659.0V180" fill="none" stroke="#9b9a92" stroke-width="1.25" stroke-dasharray="4 4"/>
<text x="380" y="232" font-size="11.5" fill="#6b6a64" text-anchor="middle" font-weight="400">o toque só conta porque o teu corpo fecha o circuito até à massa (GND) do computador</text>
</svg>
